name: Dispatch and Wait
description: Dispatches a workflow_dispatch workflow and waits for the triggered run to complete

inputs:
  github-token:
    description: GitHub token with actions:write permission
    required: true
  workflow:
    description: Workflow filename to dispatch (e.g. deploy-db.yml)
    required: true
  version:
    description: Version passed as input to the workflow
    required: true
  ref:
    description: Branch or tag to dispatch the workflow on
    required: true
  repository:
    description: Target repository in owner/repo format
    required: true
  environment:
    description: Environment name passed as input to the workflow (e.g. EU-QA-DB). Omit for non-deploy workflows.
    required: false
  expected-title:
    description: Expected run displayTitle to match. Defaults to 'Deploy {environment}' if not set.
    required: false

runs:
  using: composite
  steps:
    - name: Dispatch ${{ inputs.workflow }}${{ inputs.environment && format(' for {0}', inputs.environment) || '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        FIELDS=(--field "version=${{ inputs.version }}")
        if [ -n "${{ inputs.environment }}" ]; then
          FIELDS+=(--field "environment=${{ inputs.environment }}")
        fi

        gh workflow run "${{ inputs.workflow }}" \
          --repo "${{ inputs.repository }}" \
          --ref "${{ inputs.ref }}" \
          "${FIELDS[@]}"

        if [ -n "${{ inputs.expected-title }}" ]; then
          EXPECTED_TITLE="${{ inputs.expected-title }}"
        else
          EXPECTED_TITLE="Deploy ${{ inputs.environment }}"
        fi

        for i in $(seq 1 120); do
          RUN_ID=$(gh run list \
            --repo "${{ inputs.repository }}" \
            --workflow "${{ inputs.workflow }}" \
            --branch "${{ inputs.ref }}" \
            --limit 10 \
            --json databaseId,displayTitle,status | \
            jq -r --arg title "$EXPECTED_TITLE" \
            '[.[] | select(.displayTitle == $title and .status != "completed")] | .[0].databaseId // empty')
          [ -n "$RUN_ID" ] && break
          echo "Run not yet visible, retrying in 5s... ($i/120)"
          sleep 5
        done

        if [ -z "$RUN_ID" ]; then
          echo "::error::Could not find triggered run for $EXPECTED_TITLE"
          exit 1
        fi

        echo "Waiting for run $RUN_ID ($EXPECTED_TITLE)..."
        gh run watch "$RUN_ID" --repo "${{ inputs.repository }}" --exit-status
