  deploy-eu-qa-db:
    name: Deploy EU-QA-DB
    needs: pull-artifacts
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-QA-DB

  deploy-eu-qa-app:
    name: Deploy EU-QA-App
    needs: deploy-eu-qa-db
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-QA-App

  deploy-us-qa-db:
    name: Deploy US-QA-DB
    needs: pull-artifacts
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: US-QA-DB

  deploy-us-qa-app:
    name: Deploy US-QA-App
    needs: deploy-us-qa-db
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: US-QA-App

  pre-release-prd:
    name: Pre-Release PRD Approval
    runs-on: ubuntu-24.04
    needs: [deploy-eu-qa-app, deploy-us-qa-app]
    environment: PreRelease-PRD
    concurrency:
      group: deploy-PreRelease-PRD
      cancel-in-progress: false
    steps:
      - name: Approved
        run: echo "PreRelease-PRD gate approved"

  deploy-eu-prd-db:
    name: Deploy EU-PRD-DB
    needs: pre-release-prd
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-PRD-DB

  deploy-eu-prd-app:
    name: Deploy EU-PRD-App
    needs: deploy-eu-prd-db
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-PRD-App

  deploy-us-prd-db:
