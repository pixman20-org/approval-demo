name: Orchestrator - RC

run-name: "Orchestrator - RC${{ inputs.ci_run_id && format(' ({0})', inputs.ci_run_id) || '' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being released (leave blank to read from version.json)"
        required: false
        type: string
      ci_run_id:
        description: "CI run ID to trace this pipeline back to its trigger (set automatically)"
        required: false
        type: string

permissions:
  deployments: write

jobs:
  pull-artifacts:
    name: Pull Artifacts
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version
        id: read-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT
          fi
      - name: Summarize version
        run: |
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat version.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ inputs.ci_run_id }}" ]; then
            echo "**CI Run:** [server-demo #${{ inputs.ci_run_id }}](https://github.com/pixman20-org/server-demo/actions/runs/${{ inputs.ci_run_id }})" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Pull artifacts
        run: echo "[STUB] Pulling artifacts"
      - name: Annotate check run with version info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECK_RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Pull Artifacts") | .id')

          jq -n \
            --arg title "Version Info" \
            --argjson summary "$(cat version.json)" \
            '{"output": {"title": $title, "summary": ($summary | tojson)}}' | \
          gh api "repos/$GITHUB_REPOSITORY/check-runs/$CHECK_RUN_ID" \
            --method PATCH \
            --input -

  approve-releasable-pipeline:
    name: Approve as releasable pipeline
    runs-on: ubuntu-24.04
    needs: pull-artifacts
    environment: "Approve-Pipeline-RC"
    concurrency:
      group: "approve-pipeline-rc"
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Cancel older runs at gate, wait for in-progress to reach one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            OLDER_ACTIVE=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --json databaseId,status \
              --jq '.[] | select(.status != "completed") | "\(.databaseId) \(.status)"')

            STILL_RUNNING=false

            while IFS=' ' read -r run_id status; do
              [ -z "$run_id" ] && continue
              if [ "$run_id" -lt "${{ github.run_id }}" ]; then
                if [ "$status" = "waiting" ]; then
                  echo "Superseding older waiting run: $run_id"
                  gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                else
                  echo "Older run $run_id is $status, waiting for it to reach a gate or complete..."
                  STILL_RUNNING=true
                fi
              fi
            done <<< "$OLDER_ACTIVE"

            if [ "$STILL_RUNNING" = "false" ]; then
              echo "No older active runs remain, proceeding"
              break
            fi

            sleep 10
          done

  deploy-eu-qa-db:
    name: Deploy EU-QA-DB
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, approve-releasable-pipeline]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-db.yml
          environment: EU-QA-DB
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-eu-qa-app:
    name: Deploy EU-QA-App
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-eu-qa-db]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-app.yml
          environment: EU-QA-App
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-us-qa-db:
    name: Deploy US-QA-DB
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, approve-releasable-pipeline]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-db.yml
          environment: US-QA-DB
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-us-qa-app:
    name: Deploy US-QA-App
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-us-qa-db]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-app.yml
          environment: US-QA-App
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  pre-release-prd:
    name: Pre-Release PRD Approval
    runs-on: ubuntu-24.04
    needs: [deploy-eu-qa-app, deploy-us-qa-app]
    environment: PreRelease-PRD
    concurrency:
      group: deploy-PreRelease-PRD
      cancel-in-progress: false
    steps:
      - name: Approved
        run: echo "PreRelease-PRD gate approved"

  deploy-eu-prd-db:
    name: Deploy EU-PRD-DB
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, pre-release-prd]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-db.yml
          environment: EU-PRD-DB
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-eu-prd-app:
    name: Deploy EU-PRD-App
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-eu-prd-db]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-app.yml
          environment: EU-PRD-App
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-us-prd-db:
    name: Deploy US-PRD-DB
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-eu-prd-app]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-db.yml
          environment: US-PRD-DB
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}

  deploy-us-prd-app:
    name: Deploy US-PRD-App
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-us-prd-db]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/dispatch-and-wait
        with:
          github-token: ${{ github.token }}
          workflow: deploy-app.yml
          environment: US-PRD-App
          version: ${{ needs.pull-artifacts.outputs.version }}
          ref: ${{ github.ref_name }}
          repository: ${{ github.repository }}
