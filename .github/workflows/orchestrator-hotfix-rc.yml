name: Orchestrator - Hotfix RC

on:
  workflow_dispatch:
    inputs:
      skip_qa:
        description: Skip QA environment deployments
        required: false
        default: false
        type: boolean

permissions:
  deployments: write

jobs:
  pull-artifacts:
    name: Pull Artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read version
        id: read-version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT
      - name: Summarize version
        run: |
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat version.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Pull artifacts
        run: echo "[STUB] Pulling artifacts"

  approve-releasable-pipeline:
    name: Approve as releasable pipeline
    runs-on: ubuntu-24.04
    needs: pull-artifacts
    environment: "Approve-Pipeline-Hotfix-RC"
    concurrency:
      group: "approve-pipeline-hotfix-rc"
      cancel-in-progress: true
    permissions:
      actions: write
    steps:
      - name: Cancel older runs at gate, wait for in-progress to reach one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while true; do
            OLDER_ACTIVE=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "${{ github.workflow }}" \
              --json databaseId,status \
              --jq '.[] | select(.status != "completed") | "\(.databaseId) \(.status)"')

            STILL_RUNNING=false

            while IFS=' ' read -r run_id status; do
              [ -z "$run_id" ] && continue
              if [ "$run_id" -lt "${{ github.run_id }}" ]; then
                if [ "$status" = "waiting" ]; then
                  echo "Superseding older waiting run: $run_id"
                  gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
                else
                  echo "Older run $run_id is $status, waiting for it to reach a gate or complete..."
                  STILL_RUNNING=true
                fi
              fi
            done <<< "$OLDER_ACTIVE"

            if [ "$STILL_RUNNING" = "false" ]; then
              echo "No older active runs remain, proceeding"
              break
            fi

            sleep 10
          done

  deploy-eu-qa-db:
    name: Deploy EU-QA-DB
    needs: [pull-artifacts, approve-releasable-pipeline]
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-QA-DB
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-eu-qa-app:
    name: Deploy EU-QA-App
    needs: [pull-artifacts, deploy-eu-qa-db]
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-QA-App
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-us-qa-db:
    name: Deploy US-QA-DB
    needs: [pull-artifacts, approve-releasable-pipeline]
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: US-QA-DB
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-us-qa-app:
    name: Deploy US-QA-App
    needs: [pull-artifacts, deploy-us-qa-db]
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: US-QA-App
      version: ${{ needs.pull-artifacts.outputs.version }}

  pre-release-prd:
    name: Pre-Release PRD Approval
    runs-on: ubuntu-24.04
    needs: [approve-releasable-pipeline, deploy-eu-qa-app, deploy-us-qa-app]
    if: |
      always()
      && needs.approve-releasable-pipeline.result == 'success'
      && (needs.deploy-eu-qa-app.result == 'success' || needs.deploy-eu-qa-app.result == 'skipped')
      && (needs.deploy-us-qa-app.result == 'success' || needs.deploy-us-qa-app.result == 'skipped')
    environment: PreRelease-PRD
    concurrency:
      group: deploy-PreRelease-PRD
      cancel-in-progress: false
    steps:
      - name: Approved
        run: echo "PreRelease-PRD gate approved"

  deploy-eu-prd-db:
    name: Deploy EU-PRD-DB
    needs: [pull-artifacts, pre-release-prd]
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-PRD-DB
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-eu-prd-app:
    name: Deploy EU-PRD-App
    needs: [pull-artifacts, deploy-eu-prd-db]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-PRD-App
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-us-prd-db:
    name: Deploy US-PRD-DB
    needs: [pull-artifacts, deploy-eu-prd-app]
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: US-PRD-DB
      version: ${{ needs.pull-artifacts.outputs.version }}

  deploy-us-prd-app:
    name: Deploy US-PRD-App
    needs: [pull-artifacts, deploy-us-prd-db]
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: US-PRD-App
      version: ${{ needs.pull-artifacts.outputs.version }}
