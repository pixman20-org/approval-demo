name: Orchestrator - Hotfix RC

on:
  workflow_dispatch:
    inputs:
      skip_qa:
        description: Skip QA environment deployments
        required: false
        default: false
        type: boolean

jobs:
  pull-artifacts:
    name: Pull Artifacts
    runs-on: ubuntu-24.04
    steps:
      - name: Pull artifacts
        run: echo "[STUB] Pulling artifacts"

  deploy-eu-qa-db:
    name: Deploy EU-QA-DB
    needs: pull-artifacts
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-QA-DB

  deploy-eu-qa-app:
    name: Deploy EU-QA-App
    needs: deploy-eu-qa-db
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-QA-App

  deploy-us-qa-db:
    name: Deploy US-QA-DB
    needs: pull-artifacts
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: US-QA-DB

  deploy-us-qa-app:
    name: Deploy US-QA-App
    needs: deploy-us-qa-db
    if: ${{ !inputs.skip_qa }}
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: US-QA-App

  supersede-older-runs:
    name: Supersede Older Waiting Runs
    runs-on: ubuntu-24.04
    needs: [pull-artifacts, deploy-us-qa-app]
    if: |
      always()
      && needs.pull-artifacts.result == 'success'
      && (needs.deploy-us-qa-app.result == 'success' || needs.deploy-us-qa-app.result == 'skipped')
    permissions:
      actions: write
    steps:
      - name: Cancel older runs waiting at gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "${{ github.workflow }}" \
            --status waiting \
            --json databaseId \
            --jq '.[].databaseId' | \
          while read -r run_id; do
            if [ "$run_id" -lt "${{ github.run_id }}" ]; then
              echo "Superseding older run: $run_id"
              gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            fi
          done

  pre-release-prd:
    name: Pre-Release PRD Approval
    runs-on: ubuntu-24.04
    needs: supersede-older-runs
    environment: PreRelease-PRD
    concurrency:
      group: deploy-PreRelease-PRD
      cancel-in-progress: false
    steps:
      - name: Approved
        run: echo "PreRelease-PRD gate approved"

  deploy-eu-prd-db:
    name: Deploy EU-PRD-DB
    needs: pre-release-prd
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: EU-PRD-DB

  deploy-eu-prd-app:
    name: Deploy EU-PRD-App
    needs: deploy-eu-prd-db
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: EU-PRD-App

  deploy-us-prd-db:
    name: Deploy US-PRD-DB
    needs: deploy-eu-prd-app
    uses: ./.github/workflows/deploy-db.yml
    with:
      environment: US-PRD-DB

  deploy-us-prd-app:
    name: Deploy US-PRD-App
    needs: deploy-us-prd-db
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: US-PRD-App
