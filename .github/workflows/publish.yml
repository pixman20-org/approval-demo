name: Publish

run-name: Publish ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish"
        required: true
        type: string

jobs:
  publish:
    name: Publish Images
    runs-on: ubuntu-24.04
    steps:
      - name: Publish images
        run: echo "[STUB] Publishing images for v${{ inputs.version }}"
