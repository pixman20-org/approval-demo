name: Deploy - DB

run-name: Deploy ${{ inputs.environment }}

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - US-Dev-DB
          - EU-QA-DB
          - US-QA-DB
          - EU-PRD-DB
          - US-PRD-DB
      version:
        required: false
        type: string
        default: unknown

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Update deployment status
        uses: ./.github/actions/update-deployment-status
        with:
          environment: ${{ inputs.environment }}
          version: ${{ inputs.version }}
      - name: Deploy
        run: |
          echo "Starting DB migration for ${{ inputs.environment }}"
          if false; then # set to true to simulate time taken during migrations
            for i in $(seq 1 30); do
              echo "  Operation $i/30..."
              sleep 1
            done
          fi
          echo "DB migration complete for ${{ inputs.environment }}"
