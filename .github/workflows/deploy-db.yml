name: Deploy - DB

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options:
          - US-Dev-DB
          - EU-QA-DB
          - US-QA-DB
          - EU-PRD-DB
          - US-PRD-DB

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Deploy
        run: |
          echo "Starting DB migration for ${{ inputs.environment }}"
          for i in $(seq 1 30); do
            echo "  Operation $i/30..."
            sleep 1
          done
          echo "DB migration complete for ${{ inputs.environment }}"
